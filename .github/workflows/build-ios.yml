
name: Build Nova Smart iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project NovaSmart.xcodeproj \
            -scheme NovaSmart \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS app
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "NovaSmart.app" -path "*/Build/Products/Debug-iphoneos/*" -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" NovaSmart-iOS.zip

      - name: Upload Nova Smart iOS
        uses: actions/upload-artifact@v4
        with:
          name: NovaSmart-iOS
          path: NovaSmart-iOS.zip
          if-no-files-found: error

